<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#eaf9e6">
    <title>家庭点餐系统 · 待办 + 心愿 + 影视 · 实时同步</title>
    <link href="https://fonts.loli.net/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background: linear-gradient(135deg, #eaf9e6 0%, #cde8cd 100%); color: #1c3a2a; padding: 1.5rem; min-height: 100vh; }

        /* 密码锁 */
        .password-lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #eaf9e6 0%, #cde8cd 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; }
        .password-card { background: white; border-radius: 2rem; padding: 2.5rem; box-shadow: 0 25px 40px -12px rgba(30,60,20,0.3); width: 90%; max-width: 400px; text-align: center; }
        .password-title { font-size: 1.8rem; font-weight: 700; color: #2e7d32; margin-bottom: 1.5rem; }
        .password-input { width: 100%; padding: 1rem 1.2rem; border: 2px solid #d2e8cb; border-radius: 12px; font-size: 1.2rem; margin-bottom: 1rem; text-align: center; }
        .password-btn { background: #2f6b2f; border: none; color: white; font-weight: 600; padding: 0.8rem 2rem; border-radius: 40px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; width: 100%; }
        .password-btn:hover { background: #1e4f1e; transform: scale(0.98); }
        .password-error { color: #e74c3c; margin-bottom: 1rem; font-weight: 500; display: none; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

        .main-container { max-width: 1400px; margin: 0 auto; background: rgba(255,255,245,0.75); backdrop-filter: blur(3px); border-radius: 2rem; box-shadow: 0 25px 40px -12px rgba(30,60,20,0.3); padding: 1.5rem 2rem; }
        .header-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; padding-bottom: 0.8rem; border-bottom: 2px solid #a8d5a2; }
        .date-badge { background: #f1faea; padding: 0.5rem 1.2rem; border-radius: 48px; font-weight: 600; font-size: 1.2rem; color: #2b6236; }
        .date-badge span { background: #cbe5c4; padding: 0.2rem 0.8rem; border-radius: 30px; margin-left: 0.6rem; font-size: 0.9rem; }
        .order-config { display: flex; flex-wrap: wrap; gap: 1.2rem; background: #ecf7e7; padding: 0.5rem 1.3rem; border-radius: 60px; align-items: center; }
        .config-item { display: flex; align-items: center; gap: 0.5rem; }
        .radio-group { display: flex; gap: 1rem; }
        button { background: #2f6b2f; border: none; color: white; font-weight: 600; padding: 0.5rem 1.4rem; border-radius: 40px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1e4f1e; transform: scale(0.96); }
        .main-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .main-tab { background: #e0f1db; padding: 0.6rem 1.6rem; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .main-tab.active { background: #2e7d32; color: white; }
        .page { display: none; }
        .page.active { display: block; }

        .search-wrapper { position: relative; display: flex; align-items: center; margin: 0 1rem; }
        .search-input { width: 40px; height: 42px; padding: 0 1.2rem 0 2.5rem; border: 2px solid #d2e8cb; border-radius: 48px; font-size: 1rem; background: #f1faea; color: #2b6236; transition: width 0.3s ease; outline: none; opacity: 0.8; }
        .search-input:focus, .search-wrapper:hover .search-input { width: 220px; opacity: 1; }
        .search-input::placeholder { color: #80b578; }
        .search-icon { position: absolute; left: 1rem; font-size: 1rem; color: #2b6236; pointer-events: none; }

        .list-item.is-top:not(.completed) { border-left: 3px solid #ff9800 !important; background-color: #fff9e6 !important; }
        .list-item-top:disabled { opacity: 0.5; cursor: not-allowed; }
        .category-tabs { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1.2rem 0 1.8rem 0; border-bottom: 1px solid #c2e0bc; padding-bottom: 0.6rem; }
        .cat-btn { background: #e0f1db; padding: 0.5rem 1.5rem; border-radius: 40px; font-weight: 600; cursor: pointer; color: #2a5a2a; }
        .cat-btn.active { background: #2e7d32; color: white; }
        .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .dish-card { background: white; border-radius: 1.5rem; padding: 1.2rem; box-shadow: 0 8px 18px rgba(50,70,30,0.08); border: 1px solid #d2e8cb; }
        .dish-name { font-size: 1.25rem; font-weight: 700; color: #215c2e; }
        .cat-tag { font-size: 0.7rem; background: #e9f3e4; padding: 0.2rem 0.6rem; border-radius: 30px; display: inline-block; margin-left: 0.3rem; }
        .rating { background: #fef4e0; padding: 0.2rem 0.6rem; border-radius: 30px; font-size: 0.7rem; display: inline-block; }
        .checkbox-area { margin: 0.7rem 0; display: flex; align-items: center; gap: 0.6rem; }
        .checkbox-area input { width: 1.2rem; height: 1.2rem; accent-color: #2e7d32; }
        .detail-btn { background: #eff7ea; border: none; padding: 0.3rem 0.9rem; border-radius: 30px; font-size: 0.75rem; cursor: pointer; }
        .dish-actions-row { display: flex; gap: 0.3rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .dish-edit-btn { background: #3498db; padding: 0.25rem 0.6rem; font-size: 0.7rem; }
        .dish-delete-btn { background: #e74c3c; padding: 0.25rem 0.6rem; font-size: 0.7rem; }
        .submit-wrap { display: none; }
        .submit-main { font-size: 1.2rem; padding: 0.75rem 2.5rem; }

        .list-container { background: white; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .list-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; color: #2e7d32; }
        .list-input-area { display: flex; gap: 0.8rem; margin-bottom: 1rem; }
        .list-input { flex: 1; padding: 0.8rem 1.2rem; border: 1px solid #d2e8cb; border-radius: 12px; font-size: 1rem; }
        .list-submit-btn { background: #2e7d32; white-space: nowrap; }
        .list-items { max-height: 400px; overflow-y: auto; }
        .list-item { background: #f6fcef; padding: 0.9rem 1.2rem; border-radius: 12px; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; }
        .list-item.completed { background: #f0f0f0; color: #888; }
        .list-item.completed .list-item-text { text-decoration: line-through; }
        .list-item-left { display: flex; align-items: flex-start; gap: 0.6rem; flex: 1; }
        .list-item-checkbox { width: 1.1rem; height: 1.1rem; accent-color: #2e7d32; margin-top: 0.15rem; }
        .list-item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
        .list-item-edit { background: #3498db; padding: 0.4rem 0.6rem; font-size: 0.8rem; }
        .list-item-delete { background: #e74c3c; padding: 0.4rem 0.6rem; font-size: 0.8rem; }
        .list-item-meta { font-size: 0.7rem; color: #666; margin-top: 0.3rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .comment-block { margin-top: 8px; padding-left: 8px; border-left: 2px solid #a8d5a2; }
        .comment-item { background: #e8f5e9; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: flex-start; }
        .comment-content { flex: 1; margin-right: 8px; }
        .comment-actions { display: flex; gap: 4px; }
        .comment-edit-btn { background: #3498db; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; color: white; cursor: pointer; height: 16px; display: flex; align-items: center; justify-content: center; }
        .comment-meta { font-size: 0.65rem; color: #666; margin-top: 2px; }
        .cool-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30,50,20,0.6); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 2000; }
        .cool-modal-card { background: white; border-radius: 2rem; width: 90%; max-width: 500px; padding: 1.8rem; border-top: 8px solid #5fb05b; }
        .modal-title { font-size: 1.3rem; font-weight: 700; color: #2e7d32; margin-bottom: 1rem; }
        .modal-form-group { margin-bottom: 1rem; }
        .modal-form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .modal-form-input, .modal-form-textarea { width: 100%; padding: 0.8rem; border: 1px solid #d2e8cb; border-radius: 12px; font-size: 1rem; }
        .modal-form-textarea { min-height: 80px; resize: vertical; }
        .selected-dishes-list { background: #f6fcef; border-radius: 1.2rem; padding: 1rem; margin: 1rem 0; max-height: 240px; overflow-y: auto; }
        .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem; }
        #editCommentModal .modal-form-textarea { min-height: 100px; }
        .floating-submit { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #2e7d32; color: white; border-radius: 50px; padding: 14px 18px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 20px rgba(46,125,50,0.3); cursor: pointer; transition: all 0.25s ease; white-space: nowrap; overflow: hidden; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .floating-submit:hover { width: 180px; background: #1e5622; transform: translateY(-3px); box-shadow: 0 12px 24px rgba(46,125,50,0.4); }
        .floating-submit .icon { font-size: 22px; }
        .floating-submit .text { display: none; margin-left: 8px; }
        .floating-submit:hover .text { display: inline; }
        .history-float { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 320px; background: #ffffffdd; backdrop-filter: blur(12px); border-radius: 1.5rem; box-shadow: 0 12px 28px rgba(0,0,0,0.15); z-index: 1000; margin-bottom: 80px; }
        .float-header { background: #39873e; color: white; padding: 0.8rem 1rem; border-radius: 1.5rem 1.5rem 0 0; display: flex; justify-content: space-between; cursor: pointer; }
        .float-content { max-height: 350px; overflow-y: auto; padding: 0.8rem; transition: max-height 0.25s; }
        .float-content.collapsed { max-height: 0; padding: 0; overflow: hidden; }
        .record-item-mini { background: #f9fff7; border-radius: 1rem; padding: 0.6rem; margin-bottom: 0.7rem; border-left: 4px solid #6fbc6f; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .record-header-mini { font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 0.2rem; }
        .sync-status { font-size: 0.7rem; background: #e9f3e4; border-radius: 20px; padding: 0.2rem 0.6rem; display: inline-flex; align-items: center; gap: 4px; }
        footer { text-align: center; margin-top: 1rem; font-size: 0.7rem; color: #548a54; }
        .delete-record-btn { background: #e74c3c; border: none; color: white; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 20px; cursor: pointer; }
        .delete-record-btn:hover { background: #c0392b; transform: none; }
        .edit-record-btn { background: #3498db; border: none; color: white; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 20px; cursor: pointer; }
        .edit-record-btn:hover { background: #2471a3; transform: none; }
        .season-tag { background: #fdf2e8; color: #e67e22; padding: 0.1rem 0.5rem; border-radius: 20px; font-size: 0.65rem; display: inline-block; margin-left: 0.5rem; }
        .toast-notice { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 18px; border-radius: 50px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); font-size: 0.9rem; font-weight: 500; z-index: 9999; opacity: 0; transition: all 0.3s ease; white-space: nowrap; }
        .toast-notice.show { opacity: 1; top: 30px; }
        .toast-success { border-left: 5px solid #2e7d32; color: #2e7d32; }
        .toast-warning { border-left: 5px solid #f39c12; color: #b36a00; }
        .toast-error { border-left: 5px solid #e74c3c; color: #c0392b; }
        .toast-info { border-left: 5px solid #3498db; color: #2980b9; }

        /* ===== 手机适配 ===== */
        @media (max-width: 768px) {
            body { padding: 0.5rem; }
            .main-container { padding: 1rem 0.8rem; border-radius: 1.2rem; }
            .header-panel { flex-direction: column; align-items: stretch; gap: 0.6rem; }
            .date-badge { text-align: center; font-size: 1rem; }
            .order-config { flex-direction: column; gap: 0.5rem; border-radius: 1.2rem; padding: 0.6rem 1rem; }
            .config-item { justify-content: center; }
            #logoutBtn { align-self: center; }
            .main-tabs { flex-wrap: nowrap; overflow-x: auto; gap: 0.5rem; padding-bottom: 0.3rem; -webkit-overflow-scrolling: touch; }
            .main-tab { white-space: nowrap; padding: 0.5rem 1rem; font-size: 0.85rem; flex-shrink: 0; }
            .search-wrapper { margin: 0 0 0.8rem 0; width: 100%; }
            .search-input { width: 100% !important; opacity: 1; }
            .category-tabs { flex-wrap: nowrap; overflow-x: auto; gap: 0.5rem; -webkit-overflow-scrolling: touch; }
            .cat-btn { white-space: nowrap; flex-shrink: 0; font-size: 0.8rem; padding: 0.4rem 1rem; }
            .dishes-grid { grid-template-columns: 1fr; gap: 0.8rem; }
            .dish-card { padding: 1rem; border-radius: 1rem; }
            .dish-name { font-size: 1.1rem; }
            .password-card { padding: 1.8rem; border-radius: 1.5rem; }
            .password-title { font-size: 1.4rem; }
            .list-container { padding: 1rem; border-radius: 1rem; }
            .list-input-area { flex-direction: column; }
            .list-submit-btn { width: 100%; padding: 0.7rem; }
            .list-item { flex-direction: column; gap: 0.5rem; }
            .list-item-actions { align-self: flex-end; }
            button { min-height: 44px; padding: 0.6rem 1.2rem; }
            .list-item-edit, .list-item-delete, .list-item-top { min-height: 36px; padding: 0.4rem 0.7rem; font-size: 0.75rem; }
            .history-float { position: fixed; bottom: 0; left: 0; right: 0; width: 100% !important; border-radius: 1.2rem 1.2rem 0 0; margin-bottom: 0; z-index: 1000; }
            .float-header { border-radius: 1.2rem 1.2rem 0 0; }
            .float-content { max-height: 250px; }
            .floating-submit { bottom: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; }
            .cool-modal-card { width: 94%; max-width: none; padding: 1.2rem; border-radius: 1.2rem; }
            .modal-title { font-size: 1.1rem; }
            .modal-actions { flex-direction: column; }
            .modal-actions button { width: 100%; }
            .toast-notice { width: 90%; white-space: normal; text-align: center; font-size: 0.8rem; }
            @supports (padding-bottom: env(safe-area-inset-bottom)) {
                body { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
                .history-float { padding-bottom: env(safe-area-inset-bottom); }
                .floating-submit { bottom: calc(16px + env(safe-area-inset-bottom)); }
            }
        }
        @media (max-width: 400px) {
            .password-card { padding: 1.2rem; }
            .password-title { font-size: 1.2rem; }
            .password-input { font-size: 1rem; padding: 0.8rem; }
            .dish-name { font-size: 1rem; }
            .list-item-text { font-size: 0.9rem; }
            .main-tab { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
        }
    </style>
</head>
<body>
    <!-- 密码锁 -->
    <div class="password-lock" id="passwordLock">
        <div class="password-card">
            <h2 class="password-title">🔒 共度时光事务所</h2>
            <div class="password-error" id="passwordError">密码错误，请重试</div>
            <div style="position: relative; width: 100%;">
                <input type="password" class="password-input" id="passwordInput" placeholder="请输入访问密码">
                <span id="togglePassword" style="position:absolute;right:1rem;top:50%;transform:translateY(-80%);cursor:pointer;font-size:1.2rem;color:#2e7d32;">🙈</span>
            </div>
            <button class="password-btn" id="passwordSubmit">验证密码</button>
        </div>
    </div>

    <div id="toast" class="toast-notice"></div>

    <div class="floating-submit" id="floatSubmitBtn">
        <span class="icon">✨</span>
        <span class="text">确认点餐</span>
    </div>

    <div class="main-container">
        <div class="header-panel">
            <div class="date-badge" id="currentDateDisplay"></div>
            <div class="order-config">
                <div class="config-item"><span>🥢 执箸人：</span>
                    <div class="radio-group">
                        <label><input type="radio" name="diner" value="喵呜" checked> 喵呜</label>
                        <label><input type="radio" name="diner" value="蜀黍"> 蜀黍</label>
                    </div>
                </div>
                <div class="config-item"><label>📅 日期：</label><input type="date" id="orderDate"></div>
                <div class="sync-status" id="syncStatus">🔌 连接中...</div>
                <button id="refreshAllBtn" style="background:#2980b9;font-size:0.8rem;padding:0.3rem 0.8rem;">🔄 刷新</button>
                <button id="logoutBtn" style="background:#c0392b;font-size:0.8rem;padding:0.3rem 0.8rem;" onclick="logout()">🚪 退出</button>
            </div>
        </div>

        <div class="main-tabs">
            <div class="main-tab active" data-page="order">🍽️ 点餐系统</div>
            <div class="main-tab" data-page="todo">📋 见面待办 list</div>
            <div class="main-tab" data-page="wish">🎁 心愿池 list</div>
            <div class="main-tab" data-page="movie">🎬 银幕时光 list</div>
            <div class="main-tab" data-page="travel">🎒 旅行时光 list</div>
        </div>

        <div id="page-order" class="page active">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;">
                <div class="search-wrapper" style="margin:0;flex:1;">
                    <input type="text" class="search-input" id="dishSearchInput" placeholder="搜索菜品...">
                    <span class="search-icon">🔍</span>
                </div>
                <button id="addDishBtn" style="background:#8e44ad;padding:0.4rem 1rem;font-size:0.85rem;flex-shrink:0;">➕ 添加菜品</button>
            </div>
            <div class="category-tabs" id="categoryBar"></div>
            <div class="dishes-grid" id="dishesGrid"></div>
            <div class="submit-wrap"><button class="submit-main" id="submitOrderBtn">✨ 确认点餐 ✨</button></div>
        </div>

        <div id="page-todo" class="page">
            <div class="list-container">
                <div class="list-title">📋 见面待办 List</div>
                <div class="list-input-area">
                    <input type="text" class="list-input" id="todoInput" placeholder="输入待办事项…">
                    <button class="list-submit-btn" id="todoSubmit">✅ 上传待办</button>
                </div>
                <div class="list-items" id="todoList"></div>
            </div>
        </div>

        <div id="page-wish" class="page">
            <div class="list-container">
                <div class="list-title">🎁 心愿池 List</div>
                <div class="list-input-area">
                    <input type="text" class="list-input" id="wishInput" placeholder="输入心愿…">
                    <button class="list-submit-btn" id="wishSubmit">✅ 上传心愿</button>
                </div>
                <div class="list-items" id="wishList"></div>
            </div>
        </div>

        <div id="page-movie" class="page">
            <div class="list-container">
                <div class="list-title">🎬 银幕时光 List</div>
                <div class="list-input-area">
                    <input type="text" class="list-input" id="movieInput" placeholder="输入想看的电影/剧集…">
                    <button class="list-submit-btn" id="movieSubmit">✅ 添加影视</button>
                </div>
                <div class="list-items" id="movieList"></div>
            </div>
        </div>

        <div id="page-travel" class="page">
            <div class="list-container">
                <div class="list-title">🎒 旅行时光 List</div>
                <div class="list-input-area">
                    <input type="text" class="list-input" id="travelInput" placeholder="输入旅行目的地…">
                    <button class="list-submit-btn" id="travelSubmit">✅ 添加目的地</button>
                </div>
                <div class="list-items" id="travelList"></div>
            </div>
        </div>
        <footer>🌱 食光共度 · 待办 + 心愿 + 影视 + 旅行 · Supabase 实时同步</footer>
    </div>

    <div class="history-float" id="historyFloat">
        <div class="float-header" id="floatHeader"><span>📋 当月点单记录</span><span class="toggle-icon" id="toggleFloatIcon">▼</span></div>
        <div class="float-content" id="floatContent"><div id="floatRecordList">加载中…</div><button id="refreshFloatBtn" style="width:100%;margin-top:0.5rem;">🔄 刷新</button></div>
    </div>

    <div id="coolConfirmModal" class="cool-modal">
        <div class="cool-modal-card">
            <h3>✨ 美味确认单 ✨</h3>
            <div id="confirmDishesList" class="selected-dishes-list"></div>
            <div class="modal-actions">
                <button id="cancelConfirmBtn" style="background:#b0b9a8;">再想想</button>
                <button id="proceedConfirmBtn" style="background:#2f6b2f;">确认点餐 ✅</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Supabase Auth 密码锁 =====
        const FAMILY_EMAIL = "zhangyiyiyi96@163.com"; // 👈 改成你在 Supabase 创建的用户邮箱

        async function verifyPassword() {
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const passwordLock = document.getElementById('passwordLock');
            const passwordCard = document.querySelector('.password-card');
            const password = passwordInput.value.trim();
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: FAMILY_EMAIL, password: password });
            if (!error && data.user) {
                passwordLock.style.display = 'none';
                sessionStorage.setItem('skipLock', '1');  // 本次浏览器会话内记住登录
                if (!appInitialized) { init(); appInitialized = true; }
                showToast('✅ 登录成功，欢迎使用！', 'success');
            } else {
                passwordError.style.display = 'block';
                passwordError.textContent = error?.message === 'Invalid login credentials' ? '密码错误，请重试' : (error?.message || '登录失败，请稍后重试');
                passwordInput.value = '';
                passwordCard.style.animation = 'shake 0.5s';
                setTimeout(() => { passwordCard.style.animation = ''; }, 500);
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // 本次浏览器会话内已登录过 → 自动跳过密码锁
            if (sessionStorage.getItem('skipLock') === '1') {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    document.getElementById('passwordLock').style.display = 'none';
                    if (!appInitialized) { init(); appInitialized = true; }
                    return;
                }
            }
            document.getElementById('passwordSubmit').addEventListener('click', verifyPassword);
            document.getElementById('passwordInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') verifyPassword(); });
        });

        function logout() {
            supabaseClient.auth.signOut();
            sessionStorage.removeItem('skipLock');
            appInitialized = false;
            document.getElementById('passwordLock').style.display = 'flex';
            showToast('👋 已退出登录', 'info');
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            const passInput = document.getElementById('passwordInput');
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            this.textContent = type === 'text' ? '👁️' : '🙈';
        });

        // ===== 工具函数 =====
        let appInitialized = false;

        function showToast(message, type = "info") {
            const t = document.getElementById("toast");
            t.className = "toast-notice show";
            t.classList.add(`toast-${type}`);
            t.innerText = message;
            setTimeout(() => t.classList.remove("show"), 2200);
        }

        function getCurrentUser() { return document.querySelector("input[name=diner]:checked").value; }
        function userEmoji(name) { return name === '喵呜' ? '🐱' : name === '蜀黍' ? '🧸' : '👤'; }

        function formatDate(d) {
            if (!d) return "";
            try {
                const date = new Date(d);
                return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour12: false }).format(date).replace(/\//g, '-');
            } catch (e) { return ""; }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                if (m === "'") return '&#39;';
                return m;
            });
        }

        function debounce(fn, delay) { let timer; return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), delay); }; }

        // ===== Supabase 初始化 =====
        const SUPABASE_URL = "https://drstvonqjhsuyjifdkdo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hbZVS-AzusezyfH3ukfpcQ_xvJrPRdd";
        let supabaseClient;
        if (window.supabase) { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
        else { console.error("Supabase SDK 未加载"); }

        // ===== 页面切换 =====
        document.querySelectorAll(".main-tab").forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById(`page-${tab.dataset.page}`).classList.add("active");
                const floatBtn = document.getElementById("floatSubmitBtn");
                const historyPanel = document.getElementById("historyFloat");
                if (tab.dataset.page === "order") { floatBtn.style.display = "flex"; historyPanel.style.display = "block"; }
                else { floatBtn.style.display = "none"; historyPanel.style.display = "none"; }
            };
        });

        // ===== 菜单数据 — 从 Supabase 加载 =====
        let menuCache = [];

        async function loadMenu() {
            const { data, error } = await supabaseClient.from("dishes").select("*").order("id");
            if (error) { console.error(error); showToast("菜单加载失败", "error"); return; }
            if (data && data.length > 0) { menuCache = data; }
        }

        function getSeasonalTag(cat, name) {
            if (cat !== "鲜果时光") return "";
            const m = new Date().getMonth() + 1;
            const seasonalMap = {
                1: ['草莓','车厘子','橙子','柚子','甘蔗','金桔','沙糖桔'],
                2: ['草莓','车厘子','橙子','柚子','甘蔗','金桔','沙糖桔'],
                3: ['草莓','芒果','凤梨','青提','人参果'],
                4: ['芒果','枇杷','凤梨','桑葚','樱桃','山竹'],
                5: ['荔枝','樱桃','枇杷','山竹','榴莲','芒果','凤梨'],
                6: ['西瓜','桃子','荔枝','杨梅','芒果','菠萝蜜','火龙果','杏','李子','树莓'],
                7: ['西瓜','葡萄','桃子','荔枝','龙眼','菠萝蜜','火龙果','芒果','青提','无花果','树莓'],
                8: ['西瓜','哈密瓜','葡萄','龙眼','芒果','菠萝蜜','火龙果','青提','无花果','木瓜','树莓'],
                9: ['葡萄','石榴','柚子','柿子','猕猴桃','火龙果','苹果','香梨','山楂','无花果'],
                10: ['柿子','柚子','石榴','猕猴桃','橙子','火龙果','苹果','香梨','雪莲果','人参果'],
                11: ['橙子','柚子','猕猴桃','甘蔗','金桔','山楂','苹果','香梨','雪莲果','橘子','丑橘','沃柑'],
                12: ['橙子','草莓','甘蔗','金桔','柚子','沙糖桔','橘子','丑橘','沃柑']
            };
            return seasonalMap[m]?.includes(name) ? "🍃应季" : "";
        }

        // ===== 全局状态 =====
        let currentCategory = "全部";
        let selected = new Map();
        let orders = [];
        let searchKeyword = "";

        const dishesGrid = document.getElementById("dishesGrid");
        const categoryBar = document.getElementById("categoryBar");
        const orderDateInput = document.getElementById("orderDate");
        const dishSearchInput = document.getElementById("dishSearchInput");

        function handleSearchInput() { searchKeyword = dishSearchInput.value.trim().toLowerCase(); renderDishes(); }

        function renderCategories() {
            const cats = ["全部", "中餐", "西餐", "甜点", "鲜果时光"];
            categoryBar.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('div');
                btn.classList.add('cat-btn');
                if (cat === currentCategory) btn.classList.add('active');
                btn.innerText = cat;
                btn.addEventListener('click', () => { currentCategory = cat; renderCategories(); renderDishes(); });
                categoryBar.appendChild(btn);
            });
        }

        function renderDishes() {
            let filtered = currentCategory === "全部" ? [...menuCache] : menuCache.filter(d => d.category === currentCategory);
            if (searchKeyword) { filtered = filtered.filter(dish => dish.name.toLowerCase().includes(searchKeyword)); }
            dishesGrid.innerHTML = '';
            if (filtered.length === 0) {
                dishesGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#548a54;">📭 未找到相关菜品<br>试试搜索其他关键词（如：牛排、芒果布丁、草莓）</div>`;
                return;
            }
            filtered.forEach(dish => {
                const isChecked = selected.get(dish.id) === true;
                const card = document.createElement('div');
                card.className = 'dish-card';
                const seasonTag = getSeasonalTag(dish.category, dish.name);
                card.innerHTML = `
                    <div class="dish-name">${escapeHtml(dish.name)} ${seasonTag ? `<span class='season-tag'>${seasonTag}</span>` : ''}</div>
                    <div class="rating">${escapeHtml(dish.rating)}</div>
                    <div class="cat-tag">${escapeHtml(dish.category)}</div>
                    <div class="checkbox-area">
                        <input type="checkbox" id="chk_${dish.id}" ${isChecked ? 'checked' : ''}>
                        <label for="chk_${dish.id}">✅ 点这道菜</label>
                    </div>
                    <div class="dish-actions-row">
                        <button class="detail-btn" data-practice="${escapeHtml(dish.practice)}" data-name="${escapeHtml(dish.name)}">📖 做法</button>
                        <button class="dish-edit-btn" data-id="${dish.id}">✏️</button>
                        <button class="dish-delete-btn" data-id="${dish.id}">🗑️</button>
                    </div>`;
                const chk = card.querySelector('input');
                chk.addEventListener('change', () => { selected.set(dish.id, chk.checked); });
                card.querySelector('.detail-btn').addEventListener('click', function() {
                    alert(`🍳 ${this.getAttribute('data-name')}\n做法：${this.getAttribute('data-practice')}`);
                });
                card.querySelector('.dish-edit-btn').addEventListener('click', async () => {
                    const d = menuCache.find(x => x.id === dish.id);
                    if (d) openDishEditor(d);
                });
                card.querySelector('.dish-delete-btn').addEventListener('click', async () => {
                    if (!confirm(`确定删除「${dish.name}」？`)) return;
                    const pwd = prompt("请输入管理密码：");
                    if (pwd !== "9946") { showToast("密码错误，已取消删除", "warning"); return; }
                    const { error } = await supabaseClient.from("dishes").delete().eq("id", dish.id);
                    if (error) { console.error(error); showToast("删除失败", "error"); return; }
                    await loadMenu(); renderDishes();
                    showToast("✅ 已删除", "success");
                });
                dishesGrid.appendChild(card);
            });
        }

        // ===== 菜品管理：增 / 改 / 删 =====
        function openDishEditor(dish) {
            // dish 为 null 时是新增，否则是编辑
            if (dish) {
                document.getElementById("dishEditorTitle").innerText = "✏️ 编辑菜品";
                document.getElementById("dishEditorId").value = dish.id;
                document.getElementById("dishEditorName").value = dish.name;
                document.getElementById("dishEditorCategory").value = dish.category;
                document.getElementById("dishEditorPractice").value = dish.practice || "";
                document.getElementById("dishEditorRating").value = dish.rating;
            } else {
                document.getElementById("dishEditorTitle").innerText = "🍳 添加菜品";
                document.getElementById("dishEditorId").value = "";
                document.getElementById("dishEditorName").value = "";
                document.getElementById("dishEditorCategory").value = "中餐";
                document.getElementById("dishEditorPractice").value = "";
                document.getElementById("dishEditorRating").value = "★★★★☆";
            }
            document.getElementById("dishEditorPassword").value = "";
            document.getElementById("dishEditorPassError").style.display = "none";
            document.getElementById("dishEditorModal").style.display = "flex";
        }

        document.getElementById("saveDishEditor").onclick = async () => {
            const id = document.getElementById("dishEditorId").value;
            const name = document.getElementById("dishEditorName").value.trim();
            const category = document.getElementById("dishEditorCategory").value;
            const practice = document.getElementById("dishEditorPractice").value.trim();
            const rating = document.getElementById("dishEditorRating").value;
            const password = document.getElementById("dishEditorPassword").value.trim();
            const passError = document.getElementById("dishEditorPassError");

            if (!name) { showToast("菜名不能为空", "warning"); return; }
            if (password !== "9946") {  // 👈 改这里修改管理密码
                passError.style.display = "block";
                return;
            }
            passError.style.display = "none";

            // 重复检查
            const dup = menuCache.find(d => d.name === name && String(d.id) !== String(id));
            if (dup) { showToast(`「${name}」已存在，请勿重复添加`, "warning"); return; }

            if (id) {
                const { error } = await supabaseClient.from("dishes").update({ name, category, practice, rating }).eq("id", id);
                if (error) { console.error(error); showToast("修改失败", "error"); return; }
                showToast("✅ 菜品已更新", "success");
            } else {
                const { error } = await supabaseClient.from("dishes").insert([{ name, category, practice, rating }]);
                if (error) { console.error(error); showToast("添加失败", "error"); return; }
                showToast("✅ 新菜品已添加", "success");
            }
            document.getElementById("dishEditorPassword").value = "";
            document.getElementById("dishEditorModal").style.display = "none";
            await loadMenu(); renderDishes();
        };

        document.getElementById("cancelDishEditor").onclick = () => {
            document.getElementById("dishEditorModal").style.display = "none";
        };

        // ===== 订单修改：只显示已点菜品，取消勾选即删除 =====
        function openOrderEditor(order) {
            document.getElementById("orderEditId").value = order.id;
            const currentDishes = order.dishes_list || [];
            document.getElementById("orderEditCheckList").innerHTML = currentDishes.map((name, i) => `
                <div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;">
                    <input type="checkbox" id="oed_${i}" checked>
                    <label for="oed_${i}">🍽️ ${escapeHtml(name)}</label>
                </div>
            `).join("") || "<div style='color:#888;'>暂无菜品</div>";
            document.getElementById("orderEditModal").style.display = "flex";
        }

        document.getElementById("saveOrderEdit").onclick = async () => {
            const id = document.getElementById("orderEditId").value;
            const order = orders.find(o => o.id === id);
            const currentDishes = order ? (order.dishes_list || []) : [];
            const kept = currentDishes.filter((_, i) => {
                const cb = document.getElementById(`oed_${i}`);
                return cb && cb.checked;
            });
            const { error } = await supabaseClient.from("orders").update({ dishes_list: kept }).eq("id", id);
            if (error) { console.error(error); showToast("修改失败","error"); return; }
            document.getElementById("orderEditModal").style.display = "none";
            await loadOrders();
            showToast("✅ 订单已更新","success");
        };

        document.getElementById("cancelOrderEdit").onclick = () => {
            document.getElementById("orderEditModal").style.display = "none";
        };

        // ===== 日期 =====
        function updateDate() {
            const today = new Date();
            const yyyy = today.getFullYear(), mm = String(today.getMonth()+1).padStart(2,'0'), dd = String(today.getDate()).padStart(2,'0');
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            document.getElementById("currentDateDisplay").innerHTML = `${yyyy}.${mm}.${dd} <span>${weekdays[today.getDay()]}</span>`;
            const todayStr = `${yyyy}-${mm}-${dd}`;
            const maxDate = new Date(today); maxDate.setDate(today.getDate()+7);
            orderDateInput.min = todayStr; orderDateInput.max = maxDate.toISOString().slice(0,10);
            if (!orderDateInput.value) orderDateInput.value = todayStr;
        }

        // ===== 订单 =====
        async function loadOrders() {
            document.getElementById("syncStatus").innerText = "🔄加载中";
            const { data, error } = await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});
            if (error) { console.error(error); showToast("加载失败","error"); return; }
            orders = data || [];
            renderOrderHistory();
            document.getElementById("syncStatus").innerText = "☁️实时";
        }

        function renderOrderHistory() {
            const now = new Date(), y = now.getFullYear(), m = now.getMonth()+1;
            const list = orders.filter(o => { if (!o.order_date) return false; const [ry,rm] = o.order_date.split("-"); return +ry===y && +rm===m; });
            const dom = document.getElementById("floatRecordList");
            if (list.length === 0) { dom.innerHTML = "<div>🌱暂无记录</div>"; return; }
            let html = "";
            list.forEach(o => {
                const dishes = (o.dishes_list || []).map(d => escapeHtml(d));
                html += `<div class="record-item-mini"><div style="flex:1"><div class="record-header-mini"><span>${userEmoji(o.diner)} ${escapeHtml(o.diner)}</span><span>${escapeHtml(o.order_date)}</span></div><div>${dishes.join("、")}</div></div><div style="display:flex;gap:0.3rem;"><button class="edit-record-btn" data-id="${o.id}">✏️</button><button class="delete-record-btn" data-id="${o.id}">🗑️</button></div></div>`;
            });
            dom.innerHTML = html;
            dom.querySelectorAll(".edit-record-btn").forEach(btn => {
                btn.onclick = () => {
                    const order = orders.find(o => o.id === btn.dataset.id);
                    if (order) openOrderEditor(order);
                };
            });
            dom.querySelectorAll(".delete-record-btn").forEach(btn => {
                btn.onclick = async () => {
                    if (!confirm("确定删除？")) return;
                    const { error } = await supabaseClient.from("orders").delete().eq("id", btn.dataset.id);
                    if (error) { console.error(error); showToast("删除失败","error"); return; }
                    loadOrders(); showToast("✅ 订单已删除","success");
                };
            });
        }

        let isSubmitting = false;
        async function submitOrder() {
            if (isSubmitting) return;
            const ids = []; for (const [id,v] of selected) if (v) ids.push(id);
            const list = menuCache.filter(x => ids.includes(x.id));
            if (list.length === 0) { showToast("请先选菜","warning"); return; }
            const diner = getCurrentUser(), date = document.getElementById("orderDate").value;
            if (!date) { showToast("请选日期","warning"); return; }
            const names = list.map(x => x.name);
            isSubmitting = true;
            const { error } = await supabaseClient.from("orders").insert([{diner, order_date:date, dishes_list:names}]);
            isSubmitting = false;
            if (error) { showToast("提交失败","error"); return; }
            selected.clear(); renderDishes();
            showToast("✅ 点餐成功！","success");
            document.getElementById("coolConfirmModal").style.display = "none";
        }

        function showConfirm() {
            const ids = []; for (const [id,v] of selected) if (v) ids.push(id);
            const list = menuCache.filter(x => ids.includes(x.id));
            if (list.length === 0) { showToast("请先选菜","warning"); return; }
            document.getElementById("confirmDishesList").innerHTML = list.map(x => `<div>🍽️ ${escapeHtml(x.name)}</div>`).join("");
            document.getElementById("coolConfirmModal").style.display = "flex";
        }

        // ===== 待办/心愿/影视 =====
        function renderComments(item) {
            const remarks = item.remark_by || [];
            const times = item.remark_updated_at || [];
            const contents = (item.remark || "").split("\n---\n").filter(Boolean);
            let html = "";
            const maxLen = Math.min(remarks.length, contents.length);
            for (let i = 0; i < maxLen; i++) {
                if (remarks[i] && contents[i]) {
                    html += `<div class="comment-item"><div class="comment-content">${escapeHtml(contents[i])}<div class="comment-meta">${userEmoji(remarks[i])} ${escapeHtml(remarks[i])} • 📅 ${formatDate(times[i])}</div></div><div class="comment-actions"><button class="comment-edit-btn" data-type="${escapeHtml(item.type)}" data-id="${escapeHtml(item.id)}" data-index="${i}" data-content="${escapeHtml(contents[i])}">编辑</button></div></div>`;
                }
            }
            return html ? `<div class="comment-block">${html}</div>` : "";
        }

        async function loadList(type, domId) {
            const { data: items, error } = await supabaseClient.from(type).select("*").order("created_at",{ascending:false});
            const dom = document.getElementById(domId);
            if (error) { console.error(error); dom.innerHTML = '<div style="text-align:center;padding:2rem;color:#e74c3c;">⚠️ 加载失败，请刷新重试</div>'; return; }
            const itemsWithType = (items || []).map(item => ({ ...item, type }));
            const sortedItems = [...itemsWithType].sort((a, b) => {
                if (a.is_completed && !b.is_completed) return 1;
                if (!a.is_completed && b.is_completed) return -1;
                if (a.is_top && !b.is_top) return -1;
                if (!a.is_top && b.is_top) return 1;
                return new Date(b.created_at) - new Date(a.created_at);
            });
            dom.innerHTML = sortedItems.map(item => `
                <div class="list-item ${item.is_completed ? 'completed' : ''} ${item.is_top ? 'is-top' : ''}">
                    <div class="list-item-left">
                        <input type="checkbox" class="list-item-checkbox" data-type="${escapeHtml(type)}" data-id="${escapeHtml(item.id)}" ${item.is_completed ? 'checked' : ''}>
                        <div>
                            <div class="list-item-text">${escapeHtml(item.content)} ${item.is_top && !item.is_completed ? '📌' : ''}</div>
                            ${type === 'travel' && item.remark ? `<div class="travel-note" style="font-size:0.8rem;color:#555;margin-top:0.2rem;">📝 ${escapeHtml((item.remark || '').split('\n---\n')[0])}</div>` : ''}
                            <div class="list-item-meta"><span>${userEmoji(item.created_by)} ${escapeHtml(item.created_by)}</span><span>📅 ${formatDate(item.created_at)}</span>${item.completed_at ? `<span>✅ ${escapeHtml(formatDate(item.completed_at))}</span>` : ''}</div>
                            ${renderComments(item)}
                        </div>
                    </div>
                    <div class="list-item-actions">
                        ${type !== 'movie' && type !== 'travel' ? `<button class="list-item-top" data-type="${escapeHtml(type)}" data-id="${escapeHtml(item.id)}" ${item.is_completed ? 'disabled' : ''}>${item.is_top ? '取消置顶' : '置顶'}</button>` : ''}
                        <button class="list-item-edit" data-type="${escapeHtml(type)}" data-id="${escapeHtml(item.id)}">📝</button>
                        <button class="list-item-delete" data-type="${escapeHtml(type)}" data-id="${escapeHtml(item.id)}">🗑️</button>
                    </div>
                </div>`).join('');

            dom.querySelectorAll('.list-item-top').forEach(btn => {
                btn.onclick = async () => {
                    const { data: item, error: queryErr } = await supabaseClient.from(btn.dataset.type).select('is_top, is_completed').eq('id', btn.dataset.id).single();
                    if (queryErr) { console.error(queryErr); showToast('查询失败', 'error'); return; }
                    if (item.is_completed) { showToast('已完成无法置顶', 'warning'); return; }
                    const { error: updateErr } = await supabaseClient.from(btn.dataset.type).update({ is_top: !item.is_top }).eq('id', btn.dataset.id);
                    if (updateErr) { console.error(updateErr); showToast('操作失败', 'error'); return; }
                    showToast(!item.is_top ? '✅ 已置顶' : '已取消置顶', 'success');
                    loadList(type, domId);
                };
            });

            dom.querySelectorAll('.list-item-checkbox').forEach(cb => {
                cb.onchange = async () => {
                    const { error } = await supabaseClient.from(cb.dataset.type).update({ is_completed: cb.checked, completed_at: cb.checked ? new Date() : null, is_top: cb.checked ? false : undefined }).eq('id', cb.dataset.id);
                    if (error) { console.error(error); showToast('更新失败', 'error'); return; }
                    loadList(type, domId);
                };
            });

            dom.querySelectorAll('.list-item-edit').forEach(btn => {
                btn.onclick = async () => {
                    const { data, error } = await supabaseClient.from(btn.dataset.type).select('*').eq('id', btn.dataset.id).single();
                    if (error) { console.error(error); showToast('加载失败', 'error'); return; }
                    document.getElementById('editId').value = btn.dataset.id;
                    document.getElementById('editType').value = btn.dataset.type;
                    document.getElementById('editContent').value = data.content;
                    document.getElementById('editRemark').value = '';
                    document.getElementById('editModal').style.display = 'flex';
                };
            });

            dom.querySelectorAll('.list-item-delete').forEach(btn => {
                btn.onclick = async () => {
                    if (!confirm('确定删除？')) return;
                    const { error } = await supabaseClient.from(btn.dataset.type).delete().eq('id', btn.dataset.id);
                    if (error) { console.error(error); showToast('删除失败', 'error'); return; }
                    loadList(btn.dataset.type, domId);
                    showToast('✅ 已删除', 'success');
                };
            });

            dom.querySelectorAll('.comment-edit-btn').forEach(btn => {
                btn.onclick = () => {
                    document.getElementById('editCommentType').value = btn.dataset.type;
                    document.getElementById('editCommentId').value = btn.dataset.id;
                    document.getElementById('editCommentIndex').value = btn.dataset.index;
                    document.getElementById('editCommentContent').value = btn.dataset.content;
                    document.getElementById('editCommentModal').style.display = 'flex';
                };
            });
        }

        // ===== 保存编辑 =====
        document.getElementById('saveEdit').onclick = async () => {
            const id = document.getElementById('editId').value;
            const type = document.getElementById('editType').value;
            const content = document.getElementById('editContent').value.trim();
            const newRemark = document.getElementById('editRemark').value.trim();
            if (!content) { showToast('内容不能为空', 'warning'); return; }
            const { data: item, error: queryErr } = await supabaseClient.from(type).select('*').eq('id', id).single();
            if (queryErr) { console.error(queryErr); showToast('加载失败', 'error'); return; }
            const updateData = { content };
            if (newRemark) {
                const oldRemark = item.remark || '';
                const oldBy = item.remark_by || [];
                const oldTime = item.remark_updated_at || [];
                updateData.remark = oldRemark ? oldRemark + '\n---\n' + newRemark : newRemark;
                updateData.remark_by = [...oldBy, getCurrentUser()];
                updateData.remark_updated_at = [...oldTime, new Date()];
            }
            const { error: updateErr } = await supabaseClient.from(type).update(updateData).eq('id', id);
            if (updateErr) { console.error(updateErr); showToast('保存失败', 'error'); return; }
            document.getElementById('editModal').style.display = 'none';
            loadList(type, { todo:'todoList', wish:'wishList', movie:'movieList', travel:'travelList' }[type]);
            showToast('✅ 保存成功', 'success');
        };

        document.getElementById('saveEditComment').onclick = async () => {
            const type = document.getElementById('editCommentType').value;
            const id = document.getElementById('editCommentId').value;
            const index = parseInt(document.getElementById('editCommentIndex').value);
            const newContent = document.getElementById('editCommentContent').value.trim();
            if (!newContent) { showToast('备注内容不能为空', 'warning'); return; }
            const { data: item, error: queryErr } = await supabaseClient.from(type).select('*').eq('id', id).single();
            if (queryErr) { console.error(queryErr); showToast('加载失败', 'error'); return; }
            const oldRemark = item.remark || '';
            const oldTime = item.remark_updated_at || [];
            const contents = oldRemark.split("\n---\n").filter(Boolean);
            contents[index] = newContent;
            const updateData = { remark: contents.join("\n---\n"), remark_updated_at: [...oldTime] };
            const { error: updateErr } = await supabaseClient.from(type).update(updateData).eq('id', id);
            if (updateErr) { console.error(updateErr); showToast('修改失败', 'error'); return; }
            document.getElementById('editCommentModal').style.display = 'none';
            loadList(type, { todo:'todoList', wish:'wishList', movie:'movieList', travel:'travelList' }[type]);
            showToast('✅ 备注修改成功', 'success');
        };

        document.getElementById('cancelEdit').onclick = () => { document.getElementById('editModal').style.display = 'none'; };
        document.getElementById('cancelEditComment').onclick = () => { document.getElementById('editCommentModal').style.display = 'none'; };

        // ===== 新增待办/心愿/影视 =====
        document.getElementById("todoSubmit").onclick = async () => {
            const c = document.getElementById("todoInput").value.trim();
            if (!c) { showToast("请输入内容","warning"); return; }
            const { error } = await supabaseClient.from("todo").insert([{content:c, created_by:getCurrentUser(), is_top: false}]);
            if (error) { console.error(error); showToast("上传失败","error"); return; }
            document.getElementById("todoInput").value = "";
            loadList("todo","todoList"); showToast("✅ 待办已上传","success");
        };

        document.getElementById("wishSubmit").onclick = async () => {
            const c = document.getElementById("wishInput").value.trim();
            if (!c) { showToast("请输入心愿","warning"); return; }
            const { error } = await supabaseClient.from("wish").insert([{content:c, created_by:getCurrentUser(), is_top: false}]);
            if (error) { console.error(error); showToast("上传失败","error"); return; }
            document.getElementById("wishInput").value = "";
            loadList("wish","wishList"); showToast("✅ 心愿已上传","success");
        };

        document.getElementById("movieSubmit").onclick = async () => {
            const c = document.getElementById("movieInput").value.trim();
            if (!c) { showToast("请输入影视名称","warning"); return; }
            const { error } = await supabaseClient.from("movie").insert([{content:c, created_by:getCurrentUser(), is_top: false}]);
            if (error) { console.error(error); showToast("添加失败","error"); return; }
            document.getElementById("movieInput").value = "";
            loadList("movie","movieList"); showToast("✅ 影视已添加","success");
        };

        document.getElementById("travelSubmit").onclick = async () => {
            const c = document.getElementById("travelInput").value.trim();
            if (!c) { showToast("请输入旅行目的地","warning"); return; }
            const { error } = await supabaseClient.from("travel").insert([{content:c, created_by:getCurrentUser(), is_top: false}]);
            if (error) { console.error(error); showToast("添加失败","error"); return; }
            document.getElementById("travelInput").value = "";
            loadList("travel","travelList"); showToast("✅ 目的地已添加","success");
        };

        // ===== 实时订阅 =====
        function subscribe() {
            supabaseClient.channel("all").on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>loadOrders()).subscribe();
            supabaseClient.channel("todo").on("postgres_changes",{event:"*",schema:"public",table:"todo"},()=>loadList("todo","todoList")).subscribe();
            supabaseClient.channel("wish").on("postgres_changes",{event:"*",schema:"public",table:"wish"},()=>loadList("wish","wishList")).subscribe();
            supabaseClient.channel("movie").on("postgres_changes",{event:"*",schema:"public",table:"movie"},()=>loadList("movie","movieList")).subscribe();
            supabaseClient.channel("travel").on("postgres_changes",{event:"*",schema:"public",table:"travel"},()=>loadList("travel","travelList")).subscribe();
        }

        // ===== 初始化 =====
        async function init() {
            updateDate();
            await loadMenu();
            renderCategories();
            renderDishes();
            await loadOrders();
            loadList("todo","todoList");
            loadList("wish","wishList");
            loadList("movie","movieList");
            loadList("travel","travelList");
            subscribe();
            document.getElementById("floatSubmitBtn").onclick = showConfirm;
            document.getElementById("proceedConfirmBtn").onclick = submitOrder;
            document.getElementById("cancelConfirmBtn").onclick = () => document.getElementById("coolConfirmModal").style.display = "none";
            document.getElementById("refreshFloatBtn").onclick = loadOrders;
            document.getElementById("refreshAllBtn").onclick = () => {
                location.reload();
            };
            dishSearchInput.addEventListener('input', debounce(handleSearchInput, 300));
            let coll = false;
            document.getElementById("floatHeader").onclick = () => {
                coll = !coll;
                const c = document.getElementById("floatContent"), i = document.getElementById("toggleFloatIcon");
                coll ? (c.classList.add("collapsed"), i.innerText = "▲") : (c.classList.remove("collapsed"), i.innerText = "▼");
            };
            document.getElementById("addDishBtn").onclick = () => openDishEditor(null);
            document.getElementById('editModal').onclick = (e) => { if (e.target === document.getElementById('editModal')) document.getElementById('editModal').style.display = 'none'; };
            document.getElementById('editCommentModal').onclick = (e) => { if (e.target === document.getElementById('editCommentModal')) document.getElementById('editCommentModal').style.display = 'none'; };
            document.getElementById('dishEditorModal').onclick = (e) => { if (e.target === document.getElementById('dishEditorModal')) document.getElementById('dishEditorModal').style.display = 'none'; };
            document.getElementById('orderEditModal').onclick = (e) => { if (e.target === document.getElementById('orderEditModal')) document.getElementById('orderEditModal').style.display = 'none'; };
            setTimeout(() => showToast("🍃 系统加载完成","success"), 800);
        }
        // init() 在 verifyPassword 登录成功后调用
    </script>
</body>
</html>
